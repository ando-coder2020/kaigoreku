<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" role="img" aria-label="おひなさまの作り方"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D2703A"/></marker></defs><g transform="translate(0 0)">
<rect x="8" y="8" width="204" height="244" rx="14" fill="#FFFDF8" stroke="#CBBFA8" stroke-width="2"/>
<circle cx="34" cy="34" r="16" fill="#2B2622"/><text x="34" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFDF8" font-family="sans-serif">1</text>
<g transform="translate(40.0 50)"><rect x="20" y="10" width="100" height="100" fill="#D9556B" stroke="#2B2622" stroke-width="2.5"/><line x1="20" y1="10" x2="120" y2="110" stroke="#2B2622" stroke-width="2" stroke-dasharray="6 5" fill="none"/><line x1="110" y1="20" x2="40" y2="90" stroke="#D2703A" stroke-width="3" marker-end="url(#a)"/></g>
