<g transform="translate(40.0 50)"><polygon points="70,10 135,130 5,130" fill="#D9556B" stroke="#2B2622" stroke-width="2.5"/><polygon points="52,44 88,44 70,62" fill="#F7D9DB" stroke="#2B2622" stroke-width="2.5"/><line x1="70" y1="16" x2="70" y2="40" stroke="#D2703A" stroke-width="3" marker-end="url(#a)"/></g>
<text x="110.0" y="220" text-anchor="middle" font-size="15" fill="#2B2622" font-family="'BIZ UDPGothic','Noto Sans CJK JP',sans-serif"><tspan x="110.0">上の角を少し下に折る</tspan><tspan x="110.0" dy="20">（えり）</tspan></text>
</g><g transform="translate(660 0)">
<rect x="8" y="8" width="204" height="244" rx="14" fill="#FFFDF8" stroke="#CBBFA8" stroke-width="2"/>
