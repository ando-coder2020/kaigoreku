<text x="110.0" y="220" text-anchor="middle" font-size="15" fill="#2B2622" font-family="'BIZ UDPGothic','Noto Sans CJK JP',sans-serif"><tspan x="110.0">顔を描いた紙を</tspan><tspan x="110.0" dy="20">上に貼る</tspan></text>
