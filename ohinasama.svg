<g transform="translate(40.0 50)"><polygon points="70,10 135,130 5,130" fill="#D9556B" stroke="#2B2622" stroke-width="2.5"/></g>
<text x="110.0" y="232" text-anchor="middle" font-size="15" fill="#2B2622" font-family="'BIZ UDPGothic','Noto Sans CJK JP',sans-serif">三角（着物）ができた</text>
</g><g transform="translate(440 0)">
